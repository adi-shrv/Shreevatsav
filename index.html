<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>

  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-weight: 300;
      margin-top: 0;
      color: #444;
    }

    h2 {
      font-weight: 400;
      margin-top: 50px;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
    }

    .section {
      margin-top: 40px;
    }

    p {
      line-height: 1.6;
      font-weight: 300;
      margin: 4px 0;
    }

    .contact {
      margin-top: 10px;
    }

    .contact a {
      color: #111;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <h1>Aditya Shreevatsav</h1>

  <img src="image8.jpg" alt="">
  <img src="image9.jpg" alt="">
</div>
    </div>

      <p>- Waist: 28 in</p>
      <p>- Eyes: Brown</p>

</html>
